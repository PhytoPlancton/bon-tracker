# Pile complète : base, interface, collecteur, tunnel HTTPS.
#   docker compose up -d --build
# Les containers redémarrent d'eux-mêmes avec Docker Desktop.
#
# Deux fichiers de configuration, et c'est volontaire :
#   .env         valeurs dont Compose a besoin pour composer ce fichier ;
#                aucune ne contient de « $ ».
#   secrets.env  clés et mots de passe, transmis tels quels aux containers.
#                Compose interprète « $ » dans .env — un hash bcrypt y serait
#                amputé — alors qu'un fichier passé par `env_file` ne l'est
#                jamais.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    # Aucun port publié : la base n'est joignable que par les autres services.
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - secrets.env
    environment:
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB:-bon_tracker}?authSource=admin
      MONGODB_DB: ${MONGO_DB:-bon_tracker}
    ports:
      # Accessible depuis le PC lui-même ; l'extérieur passe par le tunnel.
      - '127.0.0.1:3000:3000'

  worker:
    build: ./worker
    restart: unless-stopped
    depends_on:
      - web
    env_file:
      - secrets.env
    environment:
      API_BASE_URL: http://web:3000
      CRON_SCHEDULE: ${CRON_SCHEDULE:-17 */6 * * *}
      RUN_ON_START: 'true'
    volumes:
      # Captures d'écran laissées par le collecteur quand un relevé échoue :
      # c'est le seul moyen de voir la page qu'il avait sous les yeux.
      - ./debug:/app/debug
    # Chromium a besoin de mémoire partagée pour ne pas planter.
    shm_size: 1gb

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - web
    # Démarré seulement quand un tunnel est configuré : COMPOSE_PROFILES vaut
    # alors « tunnel » dans .env. Sans cela le container redémarrerait en
    # boucle faute de jeton.
    profiles: ['tunnel']
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}

volumes:
  mongo-data:
